apiVersion: apps/v1
kind: Deployment
metadata:
  name: kant-frontend
  namespace: kant
  labels:
    app: kant-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kant-frontend
  template:
    metadata:
      labels:
        app: kant-frontend
    spec:
      imagePullSecrets:
        - name: aliyun-acr
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: crpi-vqzgcvtc07egicyr.ap-southeast-1.personal.cr.aliyuncs.com/kant_al/kant-frontend:v1-amd64
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kant-frontend
  namespace: kant
  labels:
    app: kant-frontend
spec:
  type: ClusterIP
  selector:
    app: kant-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
