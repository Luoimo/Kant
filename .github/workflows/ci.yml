name: Kant CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_and_deploy:
        description: Publish images to ACR and deploy to ACK
        required: false
        default: false
        type: boolean

concurrency:
  group: kant-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/kant
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kant
  REDIS_URL: redis://127.0.0.1:6379/0
  JWT_SECRET_KEY: kant-ci-only-secret-key-with-at-least-32-bytes
  OPENAI_API_KEY: ci-placeholder-key
  NOTE_BACKEND: local
  CHROMA_PERSIST_DIR: /tmp/kant-ci-chroma
  ACR_REGISTRY: crpi-vqzgcvtc07egicyr.ap-southeast-1.personal.cr.aliyuncs.com
  ACR_NAMESPACE: kant_al
  BACKEND_IMAGE: crpi-vqzgcvtc07egicyr.ap-southeast-1.personal.cr.aliyuncs.com/kant_al/kant-backend
  FRONTEND_IMAGE: crpi-vqzgcvtc07egicyr.ap-southeast-1.personal.cr.aliyuncs.com/kant_al/kant-frontend
  K8S_NAMESPACE: kant

jobs:
  # 1. 基础环境与代码规范检查
  prepare-and-lint:
    name: Preparation & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Basic Syntax Check
        run: |
          python -m pip install flake8
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # 2. 后端核心功能测试
  backend-core-tests:
    name: Backend Core Tests
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      - name: Run Core Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ --ignore=tests/security --cov=. --cov-report=xml --junitxml=core-results.xml
      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: |
            backend/core-results.xml
            backend/coverage.xml

  # 3. AI 安全测试 (MLSecOps)
  backend-security-tests:
    name: AI Security Tests
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run Security Tests
        env:
          PYTHONPATH: .
        run: pytest tests/security --junitxml=security-results.xml
      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: backend/security-results.xml

  # 4. 前端构建与测试
  frontend-build:
    name: Frontend Build
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build frontend
        run: npm run build

  # 5. 静态安全与依赖审计
  static-analysis:
    name: SAST & Dependency Audit
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install security scanners
        run: python -m pip install --upgrade bandit pip-audit semgrep

      - name: Run Bandit SAST
        run: |
          mkdir -p artifacts/sast
          bandit -r backend -x backend/dist -lll -f json -o artifacts/sast/bandit-report.json
          bandit -r backend -x backend/dist -lll -f txt -o artifacts/sast/bandit-report.txt

      - name: Run Semgrep OWASP/Python rules
        run: semgrep scan --config p/python --config p/owasp-top-ten --exclude backend/dist --json --output artifacts/sast/semgrep-report.json backend

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --format json --output artifacts/sast/pip-audit-report.json || true

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high --json > ../artifacts/sast/npm-audit-report.json

      - name: Upload SAST and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-and-dependency-reports
          path: artifacts/sast

  # 6. API 集成测试
  postman-integration:
    name: Postman API Integration
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: python -m pip install -r backend/requirements.txt

      - name: Start test application
        run: |
          mkdir -p artifacts/postman
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../artifacts/postman/backend.log 2>&1 &

      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Postman collection
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: >-
            collection run tests/postman/Kant_API.postman_collection.json
            -e tests/postman/local.postman_environment.json
            -r cli,json,junit,html
            --reporter-json-export artifacts/postman/postman-results.json
            --reporter-junit-export artifacts/postman/postman-results.xml
            --reporter-html-export artifacts/postman/postman-report.html
            --reporter-json-omitAllHeadersAndBody
            --reporter-html-omitAllHeadersAndBody

      - name: Upload Postman evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-integration-reports
          path: artifacts/postman

  # 7. 容器与基础设施安全
  container-security:
    name: Trivy Container & IaC Scan
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build evidence images
        run: |
          mkdir -p artifacts/trivy artifacts/container
          docker build -t kant-backend:evidence -f Dockerfile .
          docker build -t kant-frontend:evidence frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kant-backend:evidence
          format: table
          output: artifacts/trivy/trivy-backend.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kant-frontend:evidence
          format: table
          output: artifacts/trivy/trivy-frontend.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Kubernetes IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          format: table
          output: artifacts/trivy/trivy-kubernetes-iac.txt
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Publish Trivy release-gate summary
        run: |
          {
            echo "## Trivy release gate: PASS"
            echo
            echo "| Scope | Gate | Result |"
            echo "| --- | --- | --- |"
            echo "| Backend container | Fixable HIGH / CRITICAL = 0 | PASS |"
            echo "| Frontend container | Fixable HIGH / CRITICAL = 0 | PASS |"
            echo "| Kubernetes IaC | HIGH / CRITICAL = 0 | PASS |"
            echo
            echo "Container scans use \`ignore-unfixed: true\`; vulnerabilities without an upstream fix remain documented by dependency audit."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Capture container interaction evidence
        run: |
          docker image inspect kant-backend:evidence > artifacts/container/backend-image-inspect.json
          docker image inspect kant-frontend:evidence > artifacts/container/frontend-image-inspect.json
          docker image history --no-trunc kant-backend:evidence > artifacts/container/backend-image-history.txt
          docker run -d --name kant-frontend-evidence -p 18080:8080 kant-frontend:evidence
          sleep 3
          curl -fsS http://127.0.0.1:18080/healthz > artifacts/container/frontend-health.txt
          docker inspect kant-frontend-evidence > artifacts/container/frontend-container-inspect.json
          docker logs kant-frontend-evidence > artifacts/container/frontend-container.log 2>&1
          docker ps --filter name=kant-frontend-evidence > artifacts/container/docker-ps.txt
          docker rm -f kant-frontend-evidence

      - name: Upload container and Trivy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-and-container-reports
          path: |
            artifacts/trivy
            artifacts/container

  # 8. 动态应用安全测试
  zap-dast:
    name: OWASP ZAP DAST
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install and start backend
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p artifacts/zap/reports
          chmod 0777 artifacts/zap/reports
          cd backend
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > ../artifacts/zap/backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run OWASP ZAP OpenAPI scan
        run: |
          docker run --rm --network host \
            -v "$PWD/artifacts/zap/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://127.0.0.1:8000/openapi.json \
            -f openapi \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I

      - name: Upload ZAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-reports
          path: artifacts/zap

  # 9. 基础设施与版本控制审计
  compliance-evidence:
    name: IaC & Git Audit Trail
    needs: prepare-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture version-control and IaC evidence
        run: |
          mkdir -p artifacts/compliance/k8s
          git log --date=iso-strict --pretty=format:'%h | %ad | %an | %s' --all > artifacts/compliance/git-audit-trail.txt
          git shortlog -sne --all > artifacts/compliance/git-contribution-summary.txt
          git log --stat --oneline --all > artifacts/compliance/git-change-statistics.txt
          cp k8s/*.yaml artifacts/compliance/k8s/

      - name: Upload compliance-as-code evidence
        uses: actions/upload-artifact@v4
        with:
          name: iac-and-git-audit-evidence
          path: artifacts/compliance

  # 10. 汇总质量与安全门禁 (用于 PR 保护分支状态检查)
  ci-success:
    name: CI Pipeline Passed
    needs:
      - prepare-and-lint
      - backend-core-tests
      - backend-security-tests
      - frontend-build
      - static-analysis
      - postman-integration
      - container-security
      - zap-dast
      - compliance-evidence
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "CI Pipeline Failed!"
            exit 1
          else
            echo "All checks passed successfully!"
          fi

  # 11. 受控发布；默认不产生阿里云资源费用
  release-control:
    name: Release Control (Cloud Opt-In)
    needs: ci-success
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record release policy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.publish_and_deploy }}" = "true" ]; then
            echo "Cloud release requested: publish to ACR and deploy to ACK."
          else
            echo "Cloud release intentionally not requested. No ACR or ACK resources will be used."
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:main-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:main-latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy

      - name: Write ACK kubeconfig
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        env:
          ACK_KUBECONFIG: ${{ secrets.ACK_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          if printf '%s' "$ACK_KUBECONFIG" | grep -q 'apiVersion:'; then
            printf '%s' "$ACK_KUBECONFIG" > "$HOME/.kube/config"
          else
            printf '%s' "$ACK_KUBECONFIG" | base64 -d > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Verify ACK access
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        run: kubectl -n "$K8S_NAMESPACE" get deployment/kant-backend deployment/kant-frontend

      - name: Update deployment images
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/kant-backend \
            backend="${BACKEND_IMAGE}:${GITHUB_SHA}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/kant-frontend \
            frontend="${FRONTEND_IMAGE}:${GITHUB_SHA}"
          kubectl -n "$K8S_NAMESPACE" annotate deployment/kant-backend \
            kubernetes.io/change-cause="GitHub Actions deploy ${GITHUB_SHA}" --overwrite
          kubectl -n "$K8S_NAMESPACE" annotate deployment/kant-frontend \
            kubernetes.io/change-cause="GitHub Actions deploy ${GITHUB_SHA}" --overwrite

      - name: Wait for rollout
        if: github.event_name == 'workflow_dispatch' && inputs.publish_and_deploy
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/kant-backend --timeout=900s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/kant-frontend --timeout=900s
